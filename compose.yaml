services:
  postgres:
    image: postgres:16-alpine
    container_name: agent-relay-postgres
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agent-relay-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RELAY_DATABASE_URL: postgresql+psycopg://relay:relay@postgres:5432/relay
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  postgres_data:
